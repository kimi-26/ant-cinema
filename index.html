<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐜개미6-1영화🐜</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f3ee;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem 3rem}
.container{width:100%;max-width:480px}
.cinema-header{text-align:center;background:#fff;border-radius:16px;border:1px solid #e8e4dc;padding:1.25rem 1rem 1rem;margin-bottom:12px}
.cinema-name{font-size:22px;font-weight:700;color:#1a1a1a}
.badges{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:4px 13px;border-radius:20px;font-weight:500}
.badge-movie{background:#ede9fe;color:#4f46e5}
.badge-date{background:#fef3c7;color:#b45309}
.hero-img{width:75%;border-radius:12px;display:block;margin:0 auto 12px;border:1px solid #e8e4dc;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.funding-banner{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:center}
.funding-banner .fund-title{font-size:11px;color:#92400e;font-weight:600;margin-bottom:4px;letter-spacing:.03em}
.funding-banner .fund-body{font-size:13px;color:#78350f;font-weight:700;line-height:1.5}
#loginScreen{background:#fff;border-radius:16px;border:1px solid #e8e4dc;padding:1.5rem 1.25rem;margin-bottom:12px}
.login-tab{display:flex;gap:0;margin-bottom:1rem;border:1px solid #e0dbd3;border-radius:10px;overflow:hidden}
.tab-btn{flex:1;padding:9px;font-size:13px;font-weight:600;border:none;background:#fafaf8;color:#999;cursor:pointer;transition:all 0.15s}
.tab-btn.active{background:#6366f1;color:#fff}
.login-guide{background:#fef9ec;border:1px solid #fde68a;border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:12px;color:#92400e;line-height:1.7}
.login-guide b{font-weight:700;color:#b45309}
.login-label{font-size:12px;font-weight:600;color:#666;margin-bottom:5px;display:block}
select,input[type=text],input[type=password],input[type=number]{width:100%;padding:10px 12px;border:1.5px solid #d0ccc4;border-radius:9px;font-size:14px;background:#fafaf8;margin-bottom:10px;font-family:inherit;appearance:none;-webkit-appearance:none}
select:focus,input:focus{outline:none;border-color:#6366f1;background:#fff}
.login-btn{width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.login-btn:hover{background:#4f46e5}
.login-err{font-size:12px;color:#e11d48;text-align:center;min-height:16px;margin-top:4px}
.top-bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;border:1px solid #e8e4dc;padding:0.75rem 1rem;margin-bottom:12px}
.top-bar .who{font-size:14px;font-weight:600;color:#1a1a1a}
.top-bar .who span{color:#6366f1}
.logout-btn{font-size:12px;color:#999;background:none;border:1px solid #e0dbd3;border-radius:7px;padding:5px 10px;cursor:pointer}
.logout-btn:hover{color:#e11d48;border-color:#e11d48}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#fff;border-radius:12px;border:1px solid #e8e4dc;padding:0.7rem;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:#1a1a1a}
.stat-lbl{font-size:11px;color:#999;margin-top:2px}
.theater-card{background:#fff;border-radius:16px;border:1px solid #e8e4dc;padding:1.25rem 1rem;margin-bottom:12px}
.screen-bar{height:8px;background:#ccc;border-radius:4px 4px 10px 10px;opacity:.4;margin-bottom:5px}
.screen-lbl{text-align:center;font-size:11px;color:#bbb;letter-spacing:.12em;margin-bottom:1rem}
.col-labels{display:grid;grid-template-columns:24px repeat(4,1fr);gap:6px;margin-bottom:4px}
.col-lbl{font-size:11px;color:#bbb;text-align:center;font-weight:600}
.seat-row{display:grid;grid-template-columns:24px repeat(4,1fr);gap:6px;margin-bottom:6px}
.row-lbl{font-size:12px;color:#bbb;font-weight:700;display:flex;align-items:center;justify-content:center}
.seat{border-radius:9px 9px 5px 5px;border:1.5px solid #e0dbd3;background:#fafaf8;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .1s,border-color .1s,background .1s;padding:4px 2px;position:relative}
.seat:hover:not(.taken):not(.teacher):not(.empty):not(.locked){transform:scale(1.06);border-color:#6366f1;background:#eef2ff}
.seat.mine{background:#d1fae5;border-color:#059669}
.seat.taken{background:#f0ede8;border-color:#ddd;cursor:not-allowed;opacity:.75}
.seat.locked{cursor:not-allowed}
.seat.teacher{background:#fef3c7;border-color:#d97706;cursor:default}
.seat.empty{border:none;background:transparent;cursor:default;pointer-events:none}
.seat-id{font-size:11px;font-weight:700;color:#aaa}
.seat.mine .seat-id{color:#065f46}
.seat.taken .seat-id{color:#bbb}
.seat.teacher .seat-id{color:#92400e;font-size:10px}
.seat-who{font-size:10px;color:#bbb;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.mine .seat-who{color:#059669;font-weight:700}
.seat.teacher .seat-who{color:#b45309;font-weight:700;font-size:11px}
.teacher-ico{font-size:15px;line-height:1}
.seat-x{position:absolute;top:3px;right:4px;font-size:13px;color:#e11d48;font-weight:700;line-height:1;display:none;cursor:pointer;z-index:2}
.admin-mode .seat.taken .seat-x,.admin-mode .seat.mine .seat-x{display:block}
.divider-row{display:grid;grid-template-columns:24px 1fr;gap:6px;margin:4px 0 6px;align-items:center}
.divider-line{border:none;border-top:1.5px dashed #e0dbd3}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#999}
.legend-dot{width:14px;height:14px;border-radius:3px;border:1.5px solid}
.ld-avail{background:#fafaf8;border-color:#e0dbd3}
.ld-mine{background:#d1fae5;border-color:#059669}
.ld-taken{background:#f0ede8;border-color:#ddd}
.ld-teach{background:#fef3c7;border-color:#d97706}
#adminPanel{background:#fff;border-radius:16px;border:2px solid #e11d48;padding:1rem 1.25rem;margin-bottom:12px}
#adminPanel h3{font-size:14px;font-weight:700;color:#e11d48;margin-bottom:10px}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.admin-seat-btn{padding:8px 4px;border-radius:8px;border:1px solid #e0dbd3;font-size:11px;font-weight:600;background:#fafaf8;color:#999;cursor:default;text-align:center}
.admin-seat-btn.occ{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;cursor:pointer}
.admin-seat-btn.occ:hover{background:#fecaca}
.reset-all-btn{width:100%;padding:10px;background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.reset-all-btn:hover{background:#fecaca}
.admin-note{font-size:11px;color:#999;margin-bottom:8px}
.footer{text-align:center;font-size:11px;color:#ccc;margin-top:.5rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 22px;border-radius:24px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1}
#loadingBar{position:fixed;top:0;left:0;width:100%;height:3px;background:#6366f1;transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:9999}
#loadingBar.on{transform:scaleX(.65)}
#loadingBar.done{transform:scaleX(1);opacity:0;transition:transform .2s,opacity .35s .2s}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="loadingBar"></div>
<div class="container">

  <div class="cinema-header">
    <div class="cinema-name">🐜개미6-1영화🐜</div>
    <div class="badges">
      <span class="badge badge-movie">영화명: 🪁💌</span>
      <span class="badge badge-date">📅 4월 27일 5,6교시</span>
    </div>
  </div>

  <img id="heroImg" class="hero-img" alt="개미 영화관" />

  <div class="funding-banner">
    <div class="fund-title">🏆 펀딩 특전 — 명예의 전당</div>
    <div class="fund-body">🥇 1등&nbsp; 1🐜개미물곰 &nbsp;2005골드<br>선예매권 + 팝콘 + 음료 지급 🍿🥤</div>
  </div>

  <div id="loginScreen">
    <div class="login-tab">
      <button class="tab-btn active" id="tabStudent" onclick="switchTab('student')">🐜 학생 로그인</button>
      <button class="tab-btn" id="tabAdmin" onclick="switchTab('admin')">👩‍🏫 선생님</button>
    </div>

    <div id="studentForm">
      <div class="login-guide">
        📋 <b>로그인 방법</b><br>
        ① 아래에서 <b>내 이름</b>을 선택하세요<br>
        ② <b>PIN 번호</b>는 상태창 2차 비밀번호와 같아요<br>
        &nbsp;&nbsp;&nbsp;&nbsp;(숫자 4자리)
      </div>
      <label class="login-label">이름 선택</label>
      <select id="nameSelect">
        <option value="">-- 내 이름을 골라주세요 --</option>
      </select>
      <label class="login-label">PIN 번호 (숫자 4자리)</label>
      <input type="password" id="pinInput" placeholder="• • • •" maxlength="4" inputmode="numeric"/>
      <button class="login-btn" onclick="studentLogin()">입장하기 🎬</button>
    </div>

    <div id="adminForm" hidden>
      <label class="login-label">관리자 비밀번호</label>
      <input type="password" id="adminPwInput" placeholder="비밀번호 입력"/>
      <button class="login-btn" onclick="adminLogin()">관리자 입장 🔑</button>
    </div>

    <div class="login-err" id="loginErr"></div>
  </div>

  <div id="appArea" hidden>
    <div class="top-bar">
      <div class="who" id="whoLabel"></div>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">16</div><div class="stat-lbl">전체 좌석</div></div>
      <div class="stat-card"><div class="stat-num" id="statTaken">0</div><div class="stat-lbl">예매됨</div></div>
      <div class="stat-card"><div class="stat-num" id="statLeft">16</div><div class="stat-lbl">남은 좌석</div></div>
    </div>
    <div id="adminPanel" hidden>
      <h3>⚙️ 관리자 패널</h3>
      <p class="admin-note">예매된 좌석을 눌러 취소할 수 있어요</p>
      <div class="admin-grid" id="adminGrid"></div>
      <button class="reset-all-btn" onclick="resetAll()">🗑 전체 예매 초기화</button>
    </div>
    <div class="theater-card" id="theaterCard">
      <div class="screen-bar"></div>
      <div class="screen-lbl">S C R E E N</div>
      <div class="col-labels">
        <div></div>
        <div class="col-lbl">1</div><div class="col-lbl">2</div>
        <div class="col-lbl">3</div><div class="col-lbl">4</div>
      </div>
      <div id="seatGrid"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot ld-avail"></div>빈 좌석</div>
        <div class="legend-item"><div class="legend-dot ld-mine"></div>내 좌석</div>
        <div class="legend-item"><div class="legend-dot ld-taken"></div>예매 완료</div>
        <div class="legend-item"><div class="legend-dot ld-teach"></div>선생님석</div>
      </div>
    </div>
    <div class="footer" id="footer">연결 중...</div>
  </div>

</div>
<div class="toast" id="toast"></div>

async function fetchSeats(){const r=await fetch(FB_URL);if(!r.ok)throw new Error();return(await r.json())||{};}

function switchTab(t){
  document.getElementById('tabStudent').classList.toggle('active',t==='student');
  document.getElementById('tabAdmin').classList.toggle('active',t==='admin');
  document.getElementById('studentForm').hidden=t!=='student';
  document.getElementById('adminForm').hidden=t!=='admin';
  document.getElementById('loginErr').textContent='';
}

function studentLogin(){
  const name=document.getElementById('nameSelect').value;
  const pin=document.getElementById('pinInput').value.trim();
  const err=document.getElementById('loginErr');
  if(!name){err.textContent='이름을 선택해 주세요';return;}
  const s=STUDENTS.find(x=>x.name===name);
  if(!s||s.pin!==pin){err.textContent='PIN 번호가 틀렸어요 🔒';return;}
  myName=name;isAdmin=false;enterApp();
}
function adminLogin(){
  const pw=document.getElementById('adminPwInput').value;
  const err=document.getElementById('loginErr');
  if(pw!==ADMIN_PW){err.textContent='비밀번호가 틀렸어요 🔒';return;}
  myName='';isAdmin=true;enterApp();
}
function logout(){
  myName='';isAdmin=false;
  document.getElementById('loginScreen').hidden=false;
  document.getElementById('appArea').hidden=true;
  document.getElementById('pinInput').value='';
  document.getElementById('adminPwInput').value='';
  document.getElementById('nameSelect').value='';
  document.getElementById('loginErr').textContent='';
  clearInterval(pollTimer);
}

async function enterApp(){
  document.getElementById('loginScreen').hidden=true;
  document.getElementById('appArea').hidden=false;
  document.getElementById('adminPanel').hidden=!isAdmin;
  document.getElementById('theaterCard').classList.toggle('admin-mode',isAdmin);
  document.getElementById('whoLabel').innerHTML=isAdmin
    ?'<span>👩‍🏫 관리자 모드</span>'
    :'안녕하세요, <span>'+myName+'</span>님!';
  bar(true);
  try{seats=await fetchSeats();}catch(e){}
  bar(false);render();
  pollTimer=setInterval(poll,4000);
}

  if(isAdmin||busy)return;
  const mine=myReserved();
  if(seats[id]&&seats[id]!==myName){showToast(id+'는 이미 '+seats[id]+'님이 예매했어요');return;}
  if(mine&&mine!==id){showToast('이미 '+mine+'을 예매했어요. 취소 후 다시 선택하세요');return;}
  busy=true;bar(true);
  try{
    seats=await fetchSeats();
    if(seats[id]===myName){delete seats[id];await putSeats(seats);render();showToast(id+' 예매가 취소됐어요');}
    else if(seats[id]){showToast(id+'는 이미 '+seats[id]+'님이 예매했어요');}
    else if(myReserved()){showToast('이미 '+myReserved()+'을 예매했어요');}
    else{seats[id]=myName;await putSeats(seats);render();showToast(id+' 예매 완료! 🎉');}
  }catch(e){showToast('오류 발생! 다시 시도해 주세요');}
  finally{busy=false;bar(false);}
}

async function adminCancelSeat(id,e){
  if(e)e.stopPropagation();
  if(!confirm(seats[id]+'님의 '+id+' 예매를 취소할까요?'))return;
  bar(true);
  try{seats=await fetchSeats();delete seats[id];await putSeats(seats);render();showToast(id+' 예매 취소됨');}
  catch(e){showToast('오류 발생');}
  finally{bar(false);}
}

async function resetAll(){
  if(!confirm('모든 좌석 예매를 초기화할까요?'))return;
  bar(true);
  try{await putSeats({});seats={};render();showToast('전체 초기화 완료');}
  catch(e){showToast('오류 발생');}
  finally{bar(false);}
}

function myReserved(){for(const k in seats){if(seats[k]===myName)return k;}return null;}

function render(){
  renderGrid();
  if(isAdmin)renderAdminPanel();
  const n=Object.keys(seats).length;
  document.getElementById('statTaken').textContent=n;
  document.getElementById('statLeft').textContent=16-n;
}

function renderGrid(){
  let h='';
  ROWS.forEach(row=>{
    h+='<div class="seat-row"><div class="row-lbl">'+row+'</div>';
    COLS.forEach(col=>{
      const id=row+col,owner=seats[id];
      const ismine=!isAdmin&&owner===myName,taken=!!owner&&!ismine;
      const cls=ismine?'seat mine':taken?'seat taken':'seat';
      let inner='<span class="seat-id">'+id+'</span>';
      if(owner){
        inner+='<span class="seat-who">'+owner+'</span>';
        if(isAdmin)inner+='<span class="seat-x" onclick="adminCancelSeat(\''+id+'\',event)">✕</span>';
      }
      const click=!isAdmin?'onclick="toggleSeat(\''+id+'\')"':'';
      h+='<div class="'+cls+'" '+click+'>'+inner+'</div>';
    });
    h+='</div>';
  });
  h+='<div class="divider-row"><div></div><hr class="divider-line" style="width:100%"/></div>';
  h+='<div class="seat-row"><div class="row-lbl" style="font-size:10px;color:#ddd;">E</div>'+
     '<div class="seat empty"></div><div class="seat empty"></div><div class="seat empty"></div>'+
     '<div class="seat teacher"><span class="teacher-ico">👩‍🏫</span><span class="seat-id">E4</span><span class="seat-who">선생님</span></div></div>';
  document.getElementById('seatGrid').innerHTML=h;
}

function renderAdminPanel(){
  let h='';
  ROWS.forEach(row=>COLS.forEach(col=>{
    const id=row+col,owner=seats[id];
    h+=owner
      ?'<div class="admin-seat-btn occ" onclick="adminCancelSeat(\''+id+'\')"><b>'+id+'</b><br>'+owner.slice(0,6)+'</div>'
      :'<div class="admin-seat-btn">'+id+'</div>';
  }));
  document.getElementById('adminGrid').innerHTML=h;
}

let lastJson='';
async function poll(){
  try{
    const d=await fetchSeats(),j=JSON.stringify(d);
    if(j!==lastJson){lastJson=j;seats=d;render();}
    document.getElementById('footer').textContent='마지막 업데이트: '+new Date().toLocaleTimeString('ko-KR');
  }catch(e){}
}

function bar(on){
  const el=document.getElementById('loadingBar');
  el.className=on?'on':'done';
  if(!on)setTimeout(()=>{el.className='';},600);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

const sel=document.getElementById('nameSelect');
STUDENTS.forEach(s=>{const o=document.createElement('option');o.value=s.name;o.textContent=s.name;sel.appendChild(o);});
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')studentLogin();});
document.getElementById('adminPwInput').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin();});
</script>
</body>
</html>
